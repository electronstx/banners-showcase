<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="ad.size" content="width=800,height=600" />
        <title>Burger King</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #f4deba;
            }

            .creative,
            .media {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 100%;
                height: 100%;
                transform: translate(-50%, -50%);
            }

            .creative {
                overflow: hidden;
            }

            .media video,
            .media img,
            .creative-link {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            .creative-link {
                z-index: 1;
                background: rgba(0, 0, 0, 0.001);
            }

            .creative-link:focus {
                outline-offset: -3px;
            }
        </style>
    </head>
    <body>
        <div class="creative" id="creative">
            <div class="media" id="media">
                <video id="video" autoplay muted loop playsinline></video>
                <img id="poster" src="./poster.jpg" alt="" />
            </div>
            <a
                class="creative-link"
                href="%link1%"
                target="_blank"
                rel="noopener"
                aria-label="Перейти на сайт Burger King"
            ></a>
        </div>
        <script>
            (function () {
                var creative = document.getElementById('creative');
                var media = document.getElementById('media');
                var video = document.getElementById('video');
                var poster = document.getElementById('poster');
                var activeVideo = '';

                function updateLayout() {
                    var width = document.documentElement.clientWidth;
                    var height = document.documentElement.clientHeight;
                    if (!width || !height) return;

                    var portrait = height > width;
                    var videoWidth = portrait ? 504 : 800;
                    var videoHeight = portrait ? 896 : 600;
                    var scaleX = width / videoWidth;
                    var scaleY = height / videoHeight;
                    var scale = portrait ? Math.max(scaleX, scaleY) : Math.min(scaleX, scaleY, 1);
                    var mediaWidth = videoWidth * scale;
                    var mediaHeight = videoHeight * scale;

                    creative.style.width = (portrait ? width : mediaWidth) + 'px';
                    creative.style.height = (portrait ? height : mediaHeight) + 'px';
                    media.style.width = mediaWidth + 'px';
                    media.style.height = mediaHeight + 'px';

                    var nextVideo = portrait ? './mobile.mp4' : './creative.mp4';
                    if (activeVideo === nextVideo) return;

                    activeVideo = nextVideo;
                    poster.style.display = '';
                    poster.src = portrait ? './poster-mobile.jpg' : './poster.jpg';
                    if (video.play) video.src = nextVideo;
                }

                video.addEventListener('playing', function () {
                    poster.style.display = 'none';
                });
                video.addEventListener('error', function () {
                    poster.style.display = '';
                });

                video.muted = true;
                updateLayout();
                window.addEventListener('resize', updateLayout);
            })();
        </script>
    </body>
</html>
