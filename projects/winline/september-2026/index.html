    <body>
        <div id="root">
            <img id="fallback-image" src="./fallback-u4jaG51y.png" alt="" />
            <a id="link1" href="%link1%" target="_blank">link1</a>
        </div>
        <script nomodule>
            (function () {
                'use strict';

                var BASE_W = 158;
                var BASE_H = 300;
                var TARGET_RATIO = BASE_W / BASE_H;
                var LINK_RECT = { cx: 79, cy: 248, w: 101, h: 30 };

                var root = document.getElementById('root');
                var image = document.getElementById('fallback-image');
                var link = document.getElementById('link1');
                if (!root || !image || !link) return;

                root.style.position = 'relative';
                root.style.overflow = 'hidden';

                image.style.position = 'absolute';
                image.style.left = '0';
                image.style.top = '0';
                image.style.width = '100%';
                image.style.height = '100%';
                image.style.display = 'block';
                image.style.pointerEvents = 'none';

                function setRectFromCenter(el, cx, cy, w, h, scale) {
                    var left = (cx - w / 2) * scale;
                    var top = (cy - h / 2) * scale;

                    el.style.left = left + 'px';
                    el.style.top = top + 'px';
                    el.style.width = w * scale + 'px';
                    el.style.height = h * scale + 'px';
                }

                function layout() {
                    var docEl = document.documentElement;
                    var screenW = window.innerWidth || docEl.clientWidth || BASE_W;
                    var screenH = window.innerHeight || docEl.clientHeight || BASE_H;
                    var displayW, displayH, scale;

                    if (screenW / screenH > TARGET_RATIO) {
                        displayH = screenH;
                        displayW = displayH * TARGET_RATIO;
                    } else {
                        displayW = screenW;
                        displayH = displayW / TARGET_RATIO;
                    }

                    scale = displayW / BASE_W;

                    root.style.width = displayW + 'px';
                    root.style.height = displayH + 'px';

                    setRectFromCenter(
                        link,
                        LINK_RECT.cx,
                        LINK_RECT.cy,
                        LINK_RECT.w,
                        LINK_RECT.h,
                        scale
                    );
                }

                if (window.addEventListener) {
                    window.addEventListener('resize', layout);
                } else {
                    window.onresize = layout;
                }

                layout();
            })();
        </script>
