    <body>
        <div id="root">
            <a id="link1" href="%link1%" target="_blank">link1</a>
        </div>

        <script nomodule>
            (function () {
                'use strict';

                var BASE_W = 158;
                var BASE_H = 300;
                var SCALE = 0.5;

                var FRAMES = {
                    BG: {
                        frame: { x: 2, y: 2, w: 316, h: 600 },
                        spriteSourceSize: { x: 0, y: 0, w: 316, h: 600 },
                        sourceSize: { w: 316, h: 600 },
                    },
                    CLOUDS: {
                        frame: { x: 322, y: 2, w: 316, h: 544 },
                        spriteSourceSize: { x: 0, y: 0, w: 316, h: 544 },
                        sourceSize: { w: 316, h: 544 },
                    },
                    GIRL: {
                        frame: { x: 2, y: 606, w: 469, h: 383 },
                        spriteSourceSize: { x: 0, y: 37, w: 469, h: 383 },
                        sourceSize: { w: 502, h: 420 },
                    },
                    START_BUTTON: {
                        frame: { x: 2, y: 993, w: 234, h: 62 },
                        spriteSourceSize: { x: 0, y: 0, w: 234, h: 62 },
                        sourceSize: { w: 234, h: 62 },
                    },
                    CONTROLLER: {
                        frame: { x: 240, y: 993, w: 130, h: 110 },
                        spriteSourceSize: { x: 4, y: 4, w: 130, h: 110 },
                        sourceSize: { w: 138, h: 114 },
                    },
                    STAR: {
                        frame: { x: 2, y: 1059, w: 80, h: 67 },
                        spriteSourceSize: { x: 0, y: 3, w: 80, h: 67 },
                        sourceSize: { w: 84, h: 70 },
                    },
                };

                var CX = BASE_W / 2;
                var CY = BASE_H / 2;

                var POS = {
                    BG: { cx: CX, cy: CY, zIndex: 10 },
                    CLOUDS: { cx: CX, cy: CY + 15, zIndex: 40 },
                    STAR: { cx: CX - 55, cy: CY - 32, zIndex: 20 },
                    GIRL: { cx: CX - 20, cy: CY + 40, zIndex: 30 },
                    CONTROLLER: { cx: CX + 45, cy: CY + 75, zIndex: 50 },
                    START_BUTTON: { cx: CX, cy: CY + 118, zIndex: 60 },
                };

                var ATLAS_URL = './spritesheet.png';

                var root = document.getElementById('root');
                var link = document.getElementById('link1');
                if (!root || !link) return;

                root.style.position = 'relative';
                root.style.overflow = 'hidden';

                var scene = document.createElement('div');
                scene.style.position = 'absolute';
                scene.style.left = '0';
                scene.style.top = '0';
                scene.style.width = BASE_W + 'px';
                scene.style.height = BASE_H + 'px';
                scene.style.transformOrigin = '0 0';

                root.insertBefore(scene, link);

                function createSprite(key, cx, cy, zIndex, atlasW, atlasH) {
                    var data = FRAMES[key];
                    var frame = data.frame;
                    var sourceSize = data.sourceSize;
                    var spriteSourceSize = data.spriteSourceSize;

                    var fullW = sourceSize.w * SCALE;
                    var fullH = sourceSize.h * SCALE;
                    var frameW = frame.w * SCALE;
                    var frameH = frame.h * SCALE;

                    var fullLeft = cx - fullW / 2;
                    var fullTop = cy - fullH / 2;

                    var el = document.createElement('div');
                    el.style.position = 'absolute';
                    el.style.left = fullLeft + spriteSourceSize.x * SCALE + 'px';
                    el.style.top = fullTop + spriteSourceSize.y * SCALE + 'px';
                    el.style.width = frameW + 'px';
                    el.style.height = frameH + 'px';
                    el.style.zIndex = String(zIndex);
                    el.style.pointerEvents = 'none';

                    el.style.backgroundImage = 'url("' + ATLAS_URL + '")';
                    el.style.backgroundRepeat = 'no-repeat';
                    el.style.backgroundSize = atlasW * SCALE + 'px ' + atlasH * SCALE + 'px';
                    el.style.backgroundPosition =
                        -frame.x * SCALE + 'px ' + -frame.y * SCALE + 'px';

                    return el;
                }

                function setRectFromCenter(el, cx, cy, w, h, scale) {
                    var left = (cx - w / 2) * scale;
                    var top = (cy - h / 2) * scale;

                    el.style.left = left + 'px';
                    el.style.top = top + 'px';
                    el.style.width = w * scale + 'px';
                    el.style.height = h * scale + 'px';
                }

                function layout() {
                    var sw = window.innerWidth || document.documentElement.clientWidth || BASE_W;
                    var sh = window.innerHeight || document.documentElement.clientHeight || BASE_H;

                    var scaleX = sw / BASE_W;
                    var scaleY = sh / BASE_H;
                    var scale = scaleX < scaleY ? scaleX : scaleY;

                    var displayW = BASE_W * scale;
                    var displayH = BASE_H * scale;

                    root.style.width = displayW + 'px';
                    root.style.height = displayH + 'px';
                    scene.style.transform = 'scale(' + scale + ')';

                    var buttonW = FRAMES.START_BUTTON.sourceSize.w * SCALE;
                    var buttonH = FRAMES.START_BUTTON.sourceSize.h * SCALE;
                    setRectFromCenter(
                        link,
                        POS.START_BUTTON.cx,
                        POS.START_BUTTON.cy,
                        buttonW,
                        buttonH,
                        scale
                    );
                }

                var atlas = new Image();
                atlas.onload = function () {
                    var atlasW = atlas.naturalWidth || atlas.width;
                    var atlasH = atlas.naturalHeight || atlas.height;

                    scene.appendChild(
                        createSprite('BG', POS.BG.cx, POS.BG.cy, POS.BG.zIndex, atlasW, atlasH)
                    );
                    scene.appendChild(
                        createSprite(
                            'STAR',
                            POS.STAR.cx,
                            POS.STAR.cy,
                            POS.STAR.zIndex,
                            atlasW,
                            atlasH
                        )
                    );
                    scene.appendChild(
                        createSprite(
                            'GIRL',
                            POS.GIRL.cx,
                            POS.GIRL.cy,
                            POS.GIRL.zIndex,
                            atlasW,
                            atlasH
                        )
                    );
                    scene.appendChild(
                        createSprite(
                            'CLOUDS',
                            POS.CLOUDS.cx,
                            POS.CLOUDS.cy,
                            POS.CLOUDS.zIndex,
                            atlasW,
                            atlasH
                        )
                    );
                    scene.appendChild(
                        createSprite(
                            'CONTROLLER',
                            POS.CONTROLLER.cx,
                            POS.CONTROLLER.cy,
                            POS.CONTROLLER.zIndex,
                            atlasW,
                            atlasH
                        )
                    );
                    scene.appendChild(
                        createSprite(
                            'START_BUTTON',
                            POS.START_BUTTON.cx,
                            POS.START_BUTTON.cy,
                            POS.START_BUTTON.zIndex,
                            atlasW,
                            atlasH
                        )
                    );

                    layout();
                };

                atlas.onerror = function () {
                    if (window.console && console.log) {
                        console.log('fallback atlas load failed:', ATLAS_URL);
                    }
                };

                atlas.src = ATLAS_URL;

                var resizeHandler = layout;
                if (window.addEventListener) {
                    window.addEventListener('resize', resizeHandler);
                } else {
                    window.onresize = resizeHandler;
                }

                function cleanup() {
                    if (window.removeEventListener) {
                        window.removeEventListener('resize', resizeHandler);
                    } else if (window.onresize === resizeHandler) {
                        window.onresize = null;
                    }
                }

                if (window.addEventListener) {
                    window.addEventListener('pagehide', cleanup);
                    window.addEventListener('beforeunload', cleanup);
                    window.addEventListener('unload', cleanup);
                }
            })();
        </script>
